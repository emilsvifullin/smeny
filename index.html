<title>Смены</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#0B0C0E;
  --glow:rgba(28,30,35,1);
  --glow0:rgba(11,12,14,0);
  --surf:#141518;
  --line:rgba(255,255,255,.065);
  --line2:rgba(255,255,255,.11);
  --tint:rgba(255,255,255,.045);
  --tint2:rgba(255,255,255,.10);
  --tint-soft:rgba(255,255,255,.022);
  --ink:#F3F2EF;
  --ink2:#93959B;
  --ink3:#5C5E64;
  --gold:#D6B278;
  --gold-d:#8C7245;
  --gold-soft:rgba(214,178,120,.13);
  --gold-line:rgba(214,178,120,.40);
  --rust:#BE7168;
  --rust-line:rgba(190,113,104,.35);
  --sheet:#0F1013;
  --tabs:rgba(26,27,31,.82);
  --veil:rgba(0,0,0,.6);
  --toast-bg:rgba(240,239,236,.96);
  --toast-ink:#111214;
  --hdr:11,12,14;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --glow-op:1;
  --r:18px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F2F1EE;
    --glow:rgba(255,255,255,1);
    --glow0:rgba(242,241,238,0);
    --surf:#FFFFFF;
    --line:rgba(0,0,0,.075);
    --line2:rgba(0,0,0,.13);
    --tint:rgba(0,0,0,.04);
    --tint2:rgba(0,0,0,.075);
    --tint-soft:rgba(0,0,0,.018);
    --ink:#16171A;
    --ink2:#6C6E74;
    --ink3:#9B9DA3;
    --gold:#8F6A31;
    --gold-d:#B79A66;
    --gold-soft:rgba(143,106,49,.09);
    --gold-line:rgba(143,106,49,.32);
    --rust:#A4534A;
    --rust-line:rgba(164,83,74,.3);
    --sheet:#F7F6F3;
    --tabs:rgba(255,255,255,.86);
    --veil:rgba(0,0,0,.26);
    --toast-bg:rgba(22,23,26,.95);
    --toast-ink:#F5F4F1;
    --hdr:242,241,238;
    --shadow:0 8px 26px rgba(0,0,0,.13);
    --glow-op:.5;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  background:var(--bg);
}
body{
  margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(130% 55% at 50% -10%, var(--glow) 0%, var(--glow0) 60%), var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  min-height:100vh;
  touch-action:pan-y;
}
button,input,select{font-family:inherit}

/* шапка */
header{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  background:linear-gradient(180deg,rgba(var(--hdr),.94) 62%,rgba(var(--hdr),0));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.nav{display:flex;align-items:center;justify-content:center;gap:6px}
.nav button{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--tint);
  color:var(--ink2);
  cursor:pointer;
  display:grid;
  place-items:center;
}

.nav button svg{
  width:12px;
  height:16px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button:active{
  background:var(--tint2);
}
.period{
  flex:1;
  position:relative;
  text-align:center;
  font-size:12px;
  font-weight:600;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--ink);
  user-select:none;
  -webkit-user-select:none;
}

.period.clickable{
  cursor:pointer;
}

.period.clickable::after{
  content:"";
  position:absolute;
  left:50%;
  top:calc(50% + 11px);
  width:5px;
  height:5px;
  border-right:1.5px solid var(--ink3);
  border-bottom:1.5px solid var(--ink3);
  transform:translateX(-50%) rotate(45deg);
  opacity:.8;
}

.period.clickable:active{
  opacity:.55;
}

.period:active{
  opacity:.55;
}
main{
  padding:6px 16px 0;
  max-width:620px;
  margin:0 auto;
}

/* типографика */
.ml{font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--ink3);margin:22px 4px 9px}
.ml:first-child{margin-top:6px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}

/* герой */
.hero{padding:22px 20px 20px;position:relative;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(214,178,120,.16),rgba(214,178,120,0) 68%);
  opacity:var(--glow-op);pointer-events:none
}
.hero .k{font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--ink3)}
.hero .n{font-size:44px;font-weight:500;letter-spacing:-1.6px;color:var(--gold);margin-top:8px;line-height:1.05}
.hero .n small{font-size:24px;letter-spacing:-.5px;margin-left:3px;color:var(--gold-d)}
.hero .sub{margin-top:9px;font-size:13px;color:var(--ink2)}

/* строки */
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .l{flex:1;min-width:0}
.row .t{font-size:15px;letter-spacing:-.15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-size:15px;font-weight:500;letter-spacing:-.2px;white-space:nowrap}
.muted{color:var(--ink2)}.pos{color:var(--gold)}.neg{color:var(--rust)}
.total{background:var(--tint-soft)}

  color:var(--gold);

  -webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.fab::before,
.fab::after{
  content:"";

  top:50%;
  left:50%;
  width:18px;
  height:2px;
  border-radius:2px;
  background:currentColor;

}

<script>
/* ========== константы ========== */
const POINTS = [
  "Коммунальная Улица 10","6-Я Радиальная 3к11","Новоясеневский Проспект 22к1","Кузьминская 5",
  "Корабельная 1","Нагатинская Набережная 56а","Волгоградский Проспект 73с1","Ярцевская 6",
  "Ярцевская 25а","Пятницкий Переулок 2","Мустая Карима 12","Дыбенко 44","Крузенштерна 9",
  "Большой Овчинниковский Переулок 16","Кировоградская 11к1","Прокатная 2"
];
const TIERS = [{lim:350,rate:3000},{lim:450,rate:3500},{lim:550,rate:4500},{lim:650,rate:5500},{lim:Infinity,rate:6500}];
const FIXED_RATE = 3000;

const FIXED_POINTS = new Set([
  "6-Я Радиальная 3к11",
  "Корабельная 1",
  "Нагатинская Набережная 56а",
  "Мустая Карима 12",
  "Крузенштерна 9"
]);

const FULL_HOURS = 12;
const ADVANCE_CAP = 20000;
const MONTHS   = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const KEY = "wb-shifts-v1";
const UI_KEY = "wb-shifts-ui-v1";
const UI_SESSION_KEY = "wb-shifts-ui-session-v1";

const sameUISession =
  sessionStorage.getItem(UI_SESSION_KEY) === "1";

sessionStorage.setItem(UI_SESSION_KEY, "1");

function saveUIState(){
  localStorage.setItem(UI_KEY, JSON.stringify({
    tab,
    cursor,
    scrollY: window.scrollY
  }));
}

function loadUIState(){
  try {
    return JSON.parse(localStorage.getItem(UI_KEY)) || {};
  } catch(e){
    return {};
  }
}

const savedUI = sameUISession ? loadUIState() : {};

let shifts = [],
    tab = savedUI.tab || "shifts",
    cursor = savedUI.cursor || ymOf(new Date()),
    draft = null,
    storageOk = true;

/* ========== утилиты ========== */
function ymOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymLabel(ym){ const [y,m]=ym.split("-"); return MONTHS[+m-1]+" "+y; }
function monthNom(ym){ return MONTHS[+ym.split("-")[1]-1].toLowerCase(); }
function monthGen(ym){ return MONTHS_G[+ym.split("-")[1]-1]; }
function shiftMonth(ym,d){ const [y,m]=ym.split("-").map(Number); return ymOf(new Date(y,m-1+d,1)); }
function localYMD(date=new Date()){
  return date.getFullYear()+"-"+
    String(date.getMonth()+1).padStart(2,"0")+"-"+
    String(date.getDate()).padStart(2,"0");
}

function dateLabel(ymd){
  const [year,month,day]=ymd.split("-").map(Number);

  return day+" "+MONTHS_G[month-1]+" "+year;
}
function nf(n){ return Math.round(n).toLocaleString("ru-RU"); }
function money(n){ return nf(n)+" ₽"; }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1700); }
function hoursWord(h){
  const n=Math.floor(h), l=n%10, s=n%100;
  if(h!==n) return h+" ч";
  if(l===1&&s!==11) return n+" час";
  if(l>=2&&l<=4&&(s<10||s>=20)) return n+" часа";
  return n+" часов";
}
function shiftsWord(n){
  const l=n%10, s=n%100;
  if(l===1&&s!==11) return n+" смена";
  if(l>=2&&l<=4&&(s<10||s>=20)) return n+" смены";
  return n+" смен";
}

/* ========== расчёт ========== */
function rateForShk(shk){
  for(const t of TIERS){
    if(shk < t.lim) return t.rate;
  }

  return 6500;
}

function calc(s){
  const fixed = FIXED_POINTS.has(s.point);

  const rate = fixed
    ? FIXED_RATE
    : rateForShk(Number(s.shk) || 0);

  const hours = s.partial
    ? (Number(s.hours) || 0)
    : FULL_HOURS;

  const perHour = rate / FULL_HOURS;

  const base = s.partial
    ? Math.round(perHour * hours)
    : rate;

  const bonus = Number(s.bonus) || 0;
  const fine = Number(s.fine) || 0;

  return {
    fixed,
    rate,
    hours,
    perHour,
    base,
    bonus,
    fine,
    total: base + bonus - fine
  };
}
function inMonth(ym){ return shifts.filter(s=>s.date.slice(0,7)===ym).sort((a,b)=>a.date<b.date?1:-1); }
function sumUp(list){
  const a={n:list.length,shk:0,base:0,bonus:0,fine:0,total:0,extra:0,part:0,hours:0};
  list.forEach(s=>{
    const c=calc(s);
    a.shk += c.fixed ? 0 : (Number(s.shk) || 0);
    a.base += c.base;
    a.bonus += c.bonus;
    a.fine += c.fine;
    a.total += c.total;
    a.hours += c.hours;
    if(s.type==="extra") a.extra++;
    if(s.partial) a.part++;
  });
  return a;
}
function payouts(ym){
  const list=inMonth(ym);
  const baseFirst=list.filter(s=>+s.date.slice(8,10)<=15).reduce((n,s)=>n+calc(s).base,0);
  const advance=Math.min(baseFirst,ADVANCE_CAP);
  const all=sumUp(list);
  return { advance, baseFirst, all, rest: all.base+all.bonus-all.fine-advance, nextYm: shiftMonth(ym,1) };
}

/* ========== хранилище ========== */
function migrate(s){
  if(s && s.v===2) return s;
  const share = Number(s.share);
  const partial = !isNaN(share) && share>0 && share<100;
  return {
    v:2, id:s.id, date:s.date, point:s.point, type:s.type==="extra"?"extra":"main",
    shk:s.shk, partial,
    hours: partial ? Math.round(FULL_HOURS*share/100*10)/10 : FULL_HOURS,
    bonus: (Number(s.bonus)||0) + Math.round((Number(s.trainees)||0)*1000*(isNaN(share)?100:share)/100),
    fine: Number(s.fine)||0
  };
}
const store = (function(){
  const cloud = typeof window.storage === "object" && window.storage && typeof window.storage.get === "function";
  let local=false;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); local=true; }catch(e){ local=false; }
  return {
    mode: cloud?"cloud":local?"local":"none",
    async get(){
      if(cloud){ try{ const r=await window.storage.get(KEY); if(r&&r.value) return r.value; }catch(e){} }
      if(local) return localStorage.getItem(KEY);
      return null;
    },
    async set(v){
      if(local){ try{ localStorage.setItem(KEY,v); }catch(e){} }
      if(cloud){ await window.storage.set(KEY,v); return; }
      if(!local) throw new Error("no storage");
    }
  };
})();
async function load(){
  try{ const raw=await store.get(); shifts = raw ? JSON.parse(raw) : []; }catch(e){ shifts=[]; }
  if(!Array.isArray(shifts)) shifts=[];
  shifts = shifts.map(migrate).filter(s=>s && s.date);
  storageOk = store.mode!=="none";
  render();
}
async function save(){
  try{ await store.set(JSON.stringify(shifts)); storageOk = store.mode!=="none"; }
  catch(e){ storageOk=false; toast("Не удалось сохранить"); }
}

/* ========== экраны ========== */
const app = document.getElementById("app");
function render(){
  saveUIState();
  const period=document.getElementById("period");

  period.textContent=
  tab==="data"
    ? "Данные"
    : ymLabel(cursor);

  period.classList.toggle(
  "clickable",
  tab!=="data"
  );
  document.querySelectorAll("#prevM,#nextM").forEach(b=>b.style.visibility = tab==="data" ? "hidden" : "visible");
  document.getElementById("fab").style.display = tab==="shifts" ? "block" : "none";
  ["shifts","stats","data"].forEach(t=>document.getElementById("tab-"+t).classList.toggle("on",t===tab));
  app.innerHTML = tab==="shifts" ? viewShifts() : tab==="stats" ? viewStats() : viewData();
}

function viewShifts(){
  const list = inMonth(cursor);
  if(!list.length)
    return `<div class="card"><div class="empty">В этом месяце смен пока нет.<br>Нажмите «+», чтобы добавить.</div></div>`;
  let h = `<div class="ml">${shiftsWord(list.length)}</div><div class="card">`;
  list.forEach(s=>{
    const c=calc(s), d=s.date.split("-");
    const tags=[];
    if(s.type==="extra") tags.push(`<span class="tag g">Доп</span>`);
    if(s.partial) tags.push(`<span class="tag">${hoursWord(c.hours)}</span>`);
    if(c.bonus>0) tags.push(`<span class="tag g">+${nf(c.bonus)}</span>`);
    if(c.fine>0) tags.push(`<span class="tag r">−${nf(c.fine)}</span>`);
    h += `<div class="sh" data-edit="${s.id}">
      <div class="day"><div class="d">${+d[2]}</div><div class="w">${WD[new Date(s.date+"T12:00:00").getDay()]}</div></div>
      <div class="mid">
        <div class="p">${esc(s.point||"Без пункта")}</div>
        <div class="meta">
          <span>${c.fixed ? "Оклад" : nf(s.shk || 0) + " ШК"} · ${nf(c.rate)} ₽</span>
          ${tags.join("")}
        </div>
      </div>
      <div class="amt">${money(c.total)}</div>
    </div>`;
  });
  return h+`</div>`;
}

function viewStats(){
  const p=payouts(cursor), a=p.all;
  const pct=Math.min(100,p.baseFirst/ADVANCE_CAP*100);
  const parts=[shiftsWord(a.n)];
  if(a.extra) parts.push("доп. "+a.extra);
  if(a.part) parts.push("неполных "+a.part);
  parts.push(nf(a.shk)+" ШК");

  let h = `<div class="card">
    <div class="hero">
      <div class="k">Начислено за ${esc(monthNom(cursor))}</div>
      <div class="n">${nf(a.total)}<small> ₽</small></div>
      <div class="sub">${parts.join(" · ")}</div>
    </div>
    <div class="prog">
      <div class="top"><span>База за 1–15 число</span><span>${nf(p.baseFirst)} / ${nf(ADVANCE_CAP)} ₽</span></div>
      <div class="track"><div class="fill" style="width:${Math.max(1.5,pct)}%"></div></div>
    </div>
  </div>`;

  h += `<div class="ml">Выплаты</div><div class="card">
    <div class="row"><div class="l"><div class="t">Аванс · 25 ${esc(monthGen(cursor))}</div>
      <div class="s">база за первую половину, максимум ${nf(ADVANCE_CAP)} ₽</div></div>
      <div class="v">${money(p.advance)}</div></div>
    <div class="row"><div class="l"><div class="t">Расчёт · 10 ${esc(monthGen(p.nextYm))}</div>
      <div class="s">остаток за месяц с премиями и штрафами</div></div>
      <div class="v">${money(p.rest)}</div></div>
  </div>`;

  h += `<div class="ml">Из чего сложилось</div><div class="card">
    <div class="row"><div class="l"><div class="t">Ставки за смены</div>
      <div class="s">${shiftsWord(a.n)}${a.part?" · неполных "+a.part:""}</div></div>
      <div class="v">${money(a.base)}</div></div>
    <div class="row"><div class="l"><div class="t">Премии</div></div>
      <div class="v pos">${a.bonus?"+ ":""}${money(a.bonus)}</div></div>
    <div class="row"><div class="l"><div class="t">Штрафы</div></div>
      <div class="v neg">${a.fine?"− ":""}${money(a.fine)}</div></div>
    <div class="row total"><div class="l"><div class="t">Итого начислено</div></div>
      <div class="v">${money(a.total)}</div></div>
  </div>`;
  return h;
}

function viewData(){
  const st={
    cloud:["Данные сохраняются","Записей: "+shifts.length+". Хранятся в учётной записи Claude и доступны с другого устройства."],
    local:["Сохранено на этом устройстве","Записей: "+shifts.length+". На другом телефоне их не будет — переносите через JSON."],
    none:["Хранилище недоступно","Изменения не сохранятся. Скопируйте JSON вручную."]
  }[store.mode];
  return `<div class="ml">Состояние</div>
  <div class="card"><div class="row">
    <div class="dot ${storageOk?"":"off"}"></div>
    <div class="l"><div class="t">${st[0]}</div><div class="s" style="white-space:normal">${st[1]}</div></div>
  </div></div>
  <div class="ml">Резервная копия</div>
  <button class="btn" id="doExport">Показать JSON</button>
  <button class="btn" id="doCsv">Показать CSV для Excel</button>
  <textarea id="io" placeholder="Вставьте сюда сохранённый JSON и нажмите «Загрузить»"></textarea>
  <button class="btn gold" id="doImport">Загрузить из JSON</button>
  <div class="note">Загрузка заменяет все текущие смены содержимым поля.</div>
  <div class="ml">Опасная зона</div>
  <button class="btn warn" id="doWipe">Удалить все смены</button>`;
}

/* ========== форма ========== */
function openSheet(id){
  const sheet=document.getElementById("sheet");
  sheet.style.display="block";
  const s=shifts.find(x=>x.id===id);

  sheet.style.removeProperty("transition");
  sheet.style.removeProperty("--sheet-drag");

  draft = s ? {...s} : {
    v:2,
    id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date:localYMD(),
    point:POINTS[0],
    type:"main",
    shk:"",
    partial:false,
    hours:6,
    bonus:"",
    fine:""
  };

  document.getElementById("sheetTitle").textContent =
    s ? "Смена" : "Новая смена";

  drawSheet(!!s);

  document.body.classList.add("sheet-open");
  document.getElementById("veil").classList.add("on");
  sheet.classList.add("on");
}
function closeSheet(){
  const sheet=document.getElementById("sheet");

  closeDatePicker();
  closePointPicker();

  document.getElementById("veil").classList.remove("on");
  sheet.classList.remove("on");
  document.body.classList.remove("sheet-open");

  draft=null;

  setTimeout(()=>{
    if(!sheet.classList.contains("on")){
      sheet.style.display="none";
    }

    sheet.style.removeProperty("transition");
    sheet.style.removeProperty("--sheet-drag");
  },320);
}

let datePickerHideTimer;
let dateCalendarCursor="";
let dateJumpYear=0;
let dateSwipe=null;
let dateSwipeBlockClick=false;

function drawDatePicker(){
  const [year,month]=dateCalendarCursor.split("-").map(Number);

  document.getElementById("datePickerMonth").textContent=
    MONTHS[month-1]+" "+year;

  const firstDay=new Date(year,month-1,1,12);
  const mondayOffset=(firstDay.getDay()+6)%7;

  const gridStart=new Date(
    year,
    month-1,
    1-mondayOffset,
    12
  );

  const today=localYMD();

  let html="";

  for(let index=0;index<42;index++){
    const day=new Date(gridStart);

    day.setDate(gridStart.getDate()+index);

    const ymd=localYMD(day);
    const outside=day.getMonth()!==month-1;
    const selected=ymd===draft.date;
    const isToday=ymd===today;

    html+=`
      <button
        type="button"
        class="date-day
          ${outside?"outside":""}
          ${selected?"on":""}
          ${isToday?"today":""}
        "
        data-date="${ymd}"
        aria-label="${esc(dateLabel(ymd))}"
      >
        ${day.getDate()}
      </button>
    `;
  }

  document.getElementById("dateGrid").innerHTML=html;
}

function drawDateJump(){
  document.getElementById("dateJumpYear").textContent=
    dateJumpYear;

  document.getElementById("dateJumpMonths").innerHTML=
    MONTHS.map((month,index)=>{
      const ym=
        dateJumpYear+"-"+
        String(index+1).padStart(2,"0");

      return `
        <button
          type="button"
          class="date-jump-month ${ym===dateCalendarCursor?"on":""}"
          data-calendar-month="${ym}"
        >
          ${month}
        </button>
      `;
    }).join("");
}

function openDateJump(){
  dateJumpYear=Number(dateCalendarCursor.slice(0,4));

  drawDateJump();

  document.getElementById("dateJump").classList.add("on");
  document.getElementById("datePicker").classList.add("jump-open");

  document
    .getElementById("datePickerMonth")
    .setAttribute("aria-expanded","true");
}

function closeDateJump(){
  document.getElementById("dateJump").classList.remove("on");
  document.getElementById("datePicker").classList.remove("jump-open");
  
  document
    .getElementById("datePickerMonth")
    .setAttribute("aria-expanded","false");
}

document.getElementById("dateJumpDismiss").addEventListener(
  "click",
  e=>{
    e.preventDefault();
    e.stopImmediatePropagation();
    closeDateJump();
  }
);

function toggleDateJump(){
  const jump=document.getElementById("dateJump");

  if(jump.classList.contains("on")){
    closeDateJump();
  } else {
    openDateJump();
  }
}

function openDatePicker(){
  if(!draft) return;

  readForm();

  const picker=document.getElementById("datePicker");

  clearTimeout(datePickerHideTimer);

  picker.style.removeProperty("--date-drag");

  dateCalendarCursor=draft.date.slice(0,7);
  
  closeDateJump();
  drawDatePicker();

  picker.style.display="block";
  picker.classList.remove("on");
  picker.style.removeProperty("transition");

  document.body.classList.add("date-picker-open");
  document.getElementById("dateVeil").classList.add("on");

  void picker.offsetHeight;

  picker.classList.add("on");
}

function closeDatePicker(){
  const picker=document.getElementById("datePicker");
  
  closeDateJump();

  picker.style.removeProperty("transition");
  picker.classList.remove("on");

  document.getElementById("dateVeil").classList.remove("on");
  document.body.classList.remove("date-picker-open");

  clearTimeout(datePickerHideTimer);

  datePickerHideTimer=setTimeout(()=>{
  if(!picker.classList.contains("on")){
    picker.style.display="none";
  }

  picker.style.removeProperty("--date-drag");
  picker.style.removeProperty("transition");
},320);
}

function selectDate(ymd){
  if(!draft) return;

  draft.date=ymd;

  closeDatePicker();

  const isEdit=shifts.some(item=>item.id===draft.id);

  drawSheet(isEdit);
}

let pointPickerHideTimer;

function openPointPicker(){
  if(!draft) return;

  const list=document.getElementById("pointList");
  const picker=document.getElementById("pointPicker");

  clearTimeout(pointPickerHideTimer);

let monthSwipe=null;
let suppressMonthClick=false;

document.addEventListener("pointerdown",e=>{
  if(
    tab!=="shifts" ||
    !e.isPrimary ||
    e.pointerType==="mouse" ||
    document.body.classList.contains("sheet-open") ||
    document.body.classList.contains("point-picker-open") ||
    document.body.classList.contains("month-picker-open") ||
    e.target.closest("button,input,select,textarea,a")
  ){
    return;
  }

  monthSwipe={
    id:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    time:performance.now()
  };
});

document.addEventListener("pointermove",e=>{
  if(
    !monthSwipe ||
    e.pointerId!==monthSwipe.id
  ){
    return;
  }

  const dx=e.clientX-monthSwipe.x;
  const dy=e.clientY-monthSwipe.y;

  if(
    Math.abs(dx)>8 &&
    Math.abs(dx)>Math.abs(dy)
  ){
    document.body.classList.add("month-swiping");
  }
});

document.addEventListener("pointerup",e=>{
  if(!monthSwipe || e.pointerId!==monthSwipe.id) return;

  document.body.classList.remove("month-swiping");

  const dx=e.clientX-monthSwipe.x;
  const dy=e.clientY-monthSwipe.y;
  const duration=performance.now()-monthSwipe.time;

  monthSwipe=null;

  const horizontal=
    Math.abs(dx)>Math.abs(dy)*1.2;

  const enoughDistance=
    Math.abs(dx)>=35;

  const fastSwipe=
    Math.abs(dx)>=20 &&
    duration<=220;

  if(!horizontal || (!enoughDistance && !fastSwipe)) return;

  suppressMonthClick=true;

  cursor=shiftMonth(cursor,dx<0 ? 1 : -1);
  render();
  window.scrollTo(0,0);

  setTimeout(()=>{
    suppressMonthClick=false;
  },300);
});

document.addEventListener("pointercancel",()=>{
  monthSwipe=null;
  document.body.classList.remove("month-swiping");
});

document.addEventListener("click",e=>{
  if(!suppressMonthClick) return;

  e.preventDefault();
  e.stopImmediatePropagation();
},true);

const datePickerElement=
  document.getElementById("datePicker");

const datePickerHandle=
  document.getElementById("datePickerHandle");

let datePickerDrag=null;

datePickerHandle.addEventListener("pointerdown",e=>{
  if(
    !e.isPrimary ||
    !datePickerElement.classList.contains("on")
  ){
    return;
  }

  closeDateJump();

  datePickerDrag={
    id:e.pointerId,
    startY:e.clientY,
    distance:0,
    started:performance.now()
  };

  datePickerElement.style.transition="none";

  datePickerHandle.setPointerCapture(e.pointerId);

  e.preventDefault();
});

datePickerHandle.addEventListener("pointermove",e=>{
  if(
    !datePickerDrag ||
    e.pointerId!==datePickerDrag.id
  ){
    return;
  }

  const distance=Math.max(
    0,
    e.clientY-datePickerDrag.startY
  );

  datePickerDrag.distance=distance;

  datePickerElement.style.setProperty(
    "--date-drag",
    distance+"px"
  );

  e.preventDefault();
});

function finishDatePickerDrag(e){
  if(
    !datePickerDrag ||
    e.pointerId!==datePickerDrag.id
  ){
    return;
  }

  const {
    id,
    distance,
    started
  }=datePickerDrag;

  const duration=Math.max(
    1,
    performance.now()-started
  );

  const fastSwipe=
    distance>=28 &&
    distance/duration>=0.45;

  const shouldClose=
    distance>=80 ||
    fastSwipe;

  datePickerDrag=null;

  if(datePickerHandle.hasPointerCapture(id)){
    datePickerHandle.releasePointerCapture(id);
  }

  datePickerElement.style.removeProperty("transition");

  if(shouldClose){
    closeDatePicker();
    return;
  }

  requestAnimationFrame(()=>{
    datePickerElement.style.removeProperty("--date-drag");
  });
}

datePickerHandle.addEventListener(
  "pointerup",
  finishDatePickerDrag
);

datePickerHandle.addEventListener("pointercancel",e=>{
  if(
    !datePickerDrag ||
    e.pointerId!==datePickerDrag.id
  ){
    return;
  }

  datePickerDrag=null;

  datePickerElement.style.removeProperty("transition");

  requestAnimationFrame(()=>{
    datePickerElement.style.removeProperty("--date-drag");
  });
});

if(Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){

app.addEventListener("click",async e=>{
  const row=e.target.closest("[data-edit]");
  if(row){ openSheet(row.dataset.edit); return; }
  const b=e.target.closest("button"); if(!b) return;
  const io=document.getElementById("io");
  if(b.id==="doExport"){ io.value=JSON.stringify(shifts); io.select(); toast("Скопируйте текст"); }
  if(b.id==="doCsv"){
    const head="Дата;Пункт;Тип;ШК;Часов;Ставка;База;Премии;Штрафы;Итого";
    const rows=[...shifts].sort((a,c)=>a.date<c.date?-1:1).map(s=>{
      const c=calc(s);
      return [s.date,s.point,s.type==="extra"?"доп.":"основная",s.shk||0,c.hours,c.rate,c.base,c.bonus,c.fine,c.total].join(";");
    });
    io.value=[head,...rows].join("\n"); io.select(); toast("Скопируйте и вставьте в Excel");
  }
  if(b.id==="doImport"){
    try{
      const parsed=JSON.parse(io.value);
      if(!Array.isArray(parsed)) throw 0;
      if(!confirm("Заменить все смены данными из поля?")) return;
      shifts=parsed.map(migrate).filter(s=>s&&s.date); render(); await save(); toast("Загружено: "+shifts.length);
    }catch(err){ toast("Не похоже на сохранённый JSON"); }
  }
  if(b.id==="doWipe"){
    if(!confirm("Удалить все смены без возможности вернуть?")) return;
    shifts=[]; render(); await save(); toast("Всё удалено");
  }
});

if ("serviceWorker" in navigator) {
  let reloadingForUpdate = false;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadingForUpdate) return;

    reloadingForUpdate = true;
    location.reload();
  });

  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js", {
        updateViaCache: "none"
      });

      await registration.update();
    } catch (error) {
      console.error("Service worker не зарегистрирован:", error);
    }
  });

  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible") return;

    try {
      const registration =
        await navigator.serviceWorker.getRegistration();

      if (registration) {
        await registration.update();
      }
    } catch (error) {
      console.error("Не удалось проверить обновление:", error);
    }
  });
}
